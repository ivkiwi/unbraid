name: build
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK: "28.2.13676358"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        # Pinned: gomobile compiles the engine's Java part with it, and its checksum must not move with a JDK update.
        with: { distribution: temurin, java-version: "21.0.13+9" }
      # Any Go works here: build-libbox.sh pins go1.26.10 through GOTOOLCHAIN.
      - uses: actions/setup-go@v6
        with: { go-version: "1.26", cache: false }
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" >/dev/null # the platform (compileSdk) is fetched by the Android Gradle plugin
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ hashFiles('tools/build-libbox.sh', 'tools/sing-box-*.patch') }}
          restore-keys: gomod-
      - name: Engine (libbox.aar)
        run: tools/build-libbox.sh
      - uses: gradle/actions/setup-gradle@v5
      # Unit tests first: they don't need the committed checksum (the build script just wrote the new one), so a
      # change to the engine still gets its app code compiled and tested before the gate below.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testFossDebugUnitTest
      # The engine is built here, never on a dev machine. One that differs from the committed checksum never becomes an
      # APK: if the change is meant, commit the checksum printed here and push again.
      - name: Engine checksum vs committed
        run: |
          if ! git diff --exit-code app/libs/libbox.aar.sha256; then
            echo "::error::The engine built here differs from the committed libbox.aar.sha256. If that is intended, commit: $(cat app/libs/libbox.aar.sha256)"
            exit 1
          fi
      - name: Signing key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          PW: ${{ secrets.SIGNING_PASSWORD }}
        if: env.KS != ''
        run: |
          mkdir -p .secrets
          base64 -d <<<"$KS" > .secrets/release.jks
          printf 'storeFile=.secrets/release.jks\nstorePassword=%s\nkeyAlias=unbraid\nkeyPassword=%s\n' "$PW" "$PW" > .secrets/signing.properties
      - name: APK
        run: ./gradlew --no-daemon :app:assembleFossRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unbraid-${{ github.sha }}
          path: |
            app/build/outputs/apk/foss/release/*.apk
            app/libs/libbox.aar.sha256
            app/src/main/assets/notices.txt
          retention-days: 30
